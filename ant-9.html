<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>蟻巢文明 · 經典外觀 · 響應版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; min-height: 100vh; background-color: #1a2e1a; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 0.5rem; box-sizing: border-box; color: white; }
        #game-container { width: 100%; height: 60vh; min-height: 300px; max-width: 1200px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); overflow: hidden; background-color: #5f8b4b; position: relative; border: 4px solid #3d2b1f; }
        #game-canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        .ui-panel { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); border-radius: 24px; padding: 12px 20px; border: 2px solid #c7a35b; margin-top: 15px; width: 100%; max-width: 1200px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .stat-bar { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px 15px; margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .stat-item { text-align: center; min-width: 70px; }
        .stat-label { font-size: 0.7rem; color: #aaa; display: block; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.1rem; font-weight: bold; color: #ffd966; }
        .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .game-btn { padding: 8px 16px; border-radius: 30px; font-weight: 600; transition: all 0.15s; cursor: pointer; border: none; box-shadow: 0 4px 0 #222; font-size: 0.9rem; flex: 0 1 auto; }
        .game-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #222; }
        .worker-btn { background: #4a4a4a; color: white; }
        .soldier-btn { background: #aa2222; color: white; }
        .upgrade-btn { background: #c7a35b; color: #222; }
        .timer-display { color: #ff4d4d; font-family: monospace; }
        .consumption-hint { font-size: 0.9rem; color: #ffa500; font-weight: bold; }
        /* 遊戲庫連結 – 適應行動裝置 */
        .game-library-link {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: #5d3a1a;
            color: #ffeb99;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 6px 0 #2f4d2f, 0 10px 20px rgba(0,0,0,0.5);
            border: 2px solid #c7a35b;
            transition: all 0.15s ease;
            z-index: 100;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }
        .game-library-link:hover {
            background: #7b4f2a;
            transform: translateY(2px);
            box-shadow: 0 4px 0 #2f4d2f, 0 10px 20px rgba(0,0,0,0.5);
            color: white;
        }
        .game-library-link:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #2f4d2f, 0 10px 20px rgba(0,0,0,0.5);
        }
        /* 極小螢幕微調 */
        @media (max-width: 480px) {
            .stat-item { min-width: 50px; }
            .stat-value { font-size: 0.9rem; }
            .game-btn { padding: 8px 12px; font-size: 0.8rem; }
            .game-library-link { padding: 8px 16px; font-size: 0.8rem; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <div id="game-container"><canvas id="game-canvas"></canvas></div>

    <div class="ui-panel">
        <div class="stat-bar">
            <div class="stat-item"><span class="stat-label">🍯 存糧</span><span id="food-display" class="stat-value">0/0</span></div>
            <div class="stat-item"><span class="stat-label">⏳ 消耗倒數</span><span id="timer-display" class="stat-value timer-display">00:30</span></div>
            <div class="stat-item"><span class="stat-label">⚠️ 預計消耗</span><span id="consume-display" class="stat-value consumption-hint">-0</span></div>
            <div class="stat-item"><span class="stat-label">🐜 族群(工/兵)</span><span id="pop-display" class="stat-value">0 / 0</span></div>
            <div class="stat-item"><span class="stat-label">🏰 等級</span><span id="level-display" class="stat-value">1</span></div>
        </div>

        <div class="btn-group">
            <button id="btn-worker" class="game-btn worker-btn">召喚工蟻 (1🍯)</button>
            <button id="btn-soldier" class="game-btn soldier-btn">召喚兵蟻 (3🍯)</button>
            <button id="btn-upgrade" class="game-btn upgrade-btn">擴建蟻巢 (80%儲量)</button>
        </div>
    </div>

    <!-- 角落返回遊戲庫按鈕 (響應式位置) -->
    <a href="https://4205tt-moon.github.io/game/" class="game-library-link" target="_blank" rel="noopener">🎮 遊戲庫</a>

    <script type="module">
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        
        // --- 核心數值 ---
        let anthill = { x: 0, y: 0, r: 25, level: 1 };
        let food = 15;
        let maxFood = 30;
        let ants = [];
        let treats = [];
        let roaches = [];
        let roachNests = [];
        let gameOver = false;
        
        // --- 計時與消耗 ---
        const CONSUME_CYCLE = 30000; // 30秒
        let lastConsumeTime = performance.now();
        const WORKER_COST = 1;
        const SOLDIER_COST = 3;

        // --- 點心生成參數 (高頻率多數量) ---
        const MAX_TREATS = 40;
        const TREAT_SPAWN_INTERVAL = 250;
        let lastTreatSpawnTime = performance.now();

        // --- 螞蟻類別 (外觀採用使用者指定的簡潔版) ---
        class Ant {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = type === 'queen' ? 0.6 : (type === 'worker' ? 1.3 : 1.6);
                this.size = type === 'queen' ? 5 : 3;
                this.color = type === 'queen' ? '#cf9f2f' : (type === 'worker' ? '#222' : '#aa2222');
                this.mode = 'forage'; 
                this.target = null;
                this.carrying = false;
                this.hp = type === 'soldier' ? 3 : 1;
                // 兵蟻鎖定的蟑螂目標
                this.targetRoach = null;
            }

            update(now) {
                if (this.type === 'queen') this.moveQueen();
                else if (this.type === 'soldier') this.moveSoldier(now);
                else this.moveWorker(now);
            }

            moveQueen() {
                let d = Math.hypot(anthill.x - this.x, anthill.y - this.y);
                if (d > anthill.r * 1.5) this.angle = Math.atan2(anthill.y - this.y, anthill.x - this.x);
                else this.angle += (Math.random() - 0.5) * 0.2;
                this.applyMove();
            }

            moveWorker(now) {
                let enemy = findNearest(this, roaches);
                if (enemy && Math.hypot(enemy.x - this.x, enemy.y - this.y) < 15) {
                    this.angle = Math.atan2(this.y - enemy.y, this.x - enemy.x); // 逃跑
                } else if (this.mode === 'forage') {
                    if (!this.target || this.target.amount <= 0) this.target = findNearestActiveTreat(this);
                    if (this.target) {
                        let d = Math.hypot(this.target.x - this.x, this.target.y - this.y);
                        if (d < 5) {
                            this.target.amount--;
                            this.carrying = true;
                            this.mode = 'return';
                        } else {
                            this.angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                        }
                    } else this.angle += (Math.random() - 0.5) * 0.2;
                } else {
                    let d = Math.hypot(anthill.x - this.x, anthill.y - this.y);
                    if (d < anthill.r) {
                        if (this.carrying) { food = Math.min(maxFood, food + 1); this.carrying = false; }
                        this.mode = 'forage';
                    } else this.angle = Math.atan2(anthill.y - this.y, anthill.x - this.x);
                }
                this.applyMove();
            }

            moveSoldier(now) {
                // 檢查當前目標是否有效
                if (this.targetRoach && roaches.includes(this.targetRoach)) {
                    let d = Math.hypot(this.targetRoach.x - this.x, this.targetRoach.y - this.y);
                    if (d < 10) {
                        this.targetRoach.hp -= 0.1;
                        if (this.targetRoach.hp <= 0) {
                            food = Math.min(maxFood, food + 5);
                            roaches = roaches.filter(r => r !== this.targetRoach);
                            this.targetRoach = null; // 目標死亡，清除鎖定
                        }
                    } else {
                        this.angle = Math.atan2(this.targetRoach.y - this.y, this.targetRoach.x - this.x);
                    }
                    this.applyMove();
                    return;
                } else {
                    this.targetRoach = null; // 目標無效，清除
                }

                // --- 尋找新目標，限制每隻蟑螂最多被3隻兵蟻攻擊 ---
                // 先統計當前所有兵蟻正在攻擊的蟑螂及數量
                const attackCount = new Map();
                const soldiers = ants.filter(a => a.type === 'soldier');
                for (let soldier of soldiers) {
                    if (soldier.targetRoach && roaches.includes(soldier.targetRoach)) {
                        let roach = soldier.targetRoach;
                        attackCount.set(roach, (attackCount.get(roach) || 0) + 1);
                    }
                }

                // 找出可攻擊的蟑螂（計數 < 3），選擇最近的
                let bestTarget = null;
                let minDist = Infinity;
                for (let roach of roaches) {
                    if ((attackCount.get(roach) || 0) < 3) {
                        let d = Math.hypot(roach.x - this.x, roach.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            bestTarget = roach;
                        }
                    }
                }

                if (bestTarget) {
                    this.targetRoach = bestTarget;
                    this.angle = Math.atan2(bestTarget.y - this.y, bestTarget.x - this.x);
                } else {
                    // 沒有可攻擊目標，隨機移動
                    this.angle += (Math.random() - 0.5) * 0.3;
                }
                this.applyMove();
            }

            applyMove() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.x = Math.max(5, Math.min(W - 5, this.x));
                this.y = Math.max(5, Math.min(H - 5, this.y));
            }

            // ★ 使用者指定的精簡外觀：身體、頭部、觸角、搬運標記
            draw() {
                // 身體 (主圓)
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
                
                // 頭部 (略小的圓，位置隨角度偏移)
                const headSize = this.size * 0.7;
                const headX = this.x + Math.cos(this.angle) * (this.size + headSize * 0.4);
                const headY = this.y + Math.sin(this.angle) * (this.size + headSize * 0.4);
                ctx.beginPath(); ctx.arc(headX, headY, headSize, 0, Math.PI*2); ctx.fill();
                
                // 觸角 (兩根線條)
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 1.2;
                for (let s of [-1, 1]) {
                    ctx.beginPath();
                    ctx.moveTo(headX, headY);
                    ctx.lineTo(
                        headX + Math.cos(this.angle + s * Math.PI/6) * this.size * 1.8,
                        headY + Math.sin(this.angle + s * Math.PI/6) * this.size * 1.8
                    );
                    ctx.stroke();
                }
                
                // 搬運食物的小亮點
                if (this.carrying) {
                    ctx.fillStyle = '#ffeb99';
                    ctx.shadowColor = '#f0b300';
                    ctx.shadowBlur = 6;
                    ctx.beginPath(); ctx.arc(this.x - 2, this.y - 3, 2.5, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }

        // --- 蟑螂與巢穴 (外觀已改為紅色) ---
        class Roach {
            constructor(x, y) {
                this.x = x; this.y = y; this.hp = 10; this.speed = 0.8;
                this.angle = Math.random() * Math.PI * 2;
            }
            update() {
                let queen = ants.find(a => a.type === 'queen');
                if (queen && Math.hypot(queen.x - this.x, queen.y - this.y) < 40) {
                    this.angle = Math.atan2(queen.y - this.y, queen.x - this.x);
                    if (Math.hypot(queen.x - this.x, queen.y - this.y) < 10) triggerGameOver("蟻后被蟑螂獵殺了！");
                } else {
                    let t = findNearestActiveTreat(this);
                    if (t) {
                        if (Math.hypot(t.x - this.x, t.y - this.y) < 10) t.amount = 0;
                        else this.angle = Math.atan2(t.y - this.y, t.x - this.x);
                    }
                }
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
            }
            draw() {
                ctx.fillStyle = '#5d3a1a';
                ctx.beginPath(); ctx.ellipse(this.x, this.y, 8, 5, this.angle, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#2f1d0d';
                ctx.beginPath(); ctx.arc(this.x + 3, this.y - 2, 2, 0, 2*Math.PI); ctx.fill();
            }
        }

        class RoachNest {
            constructor(x, y) { this.x = x; this.y = y; this.lastSpawn = performance.now(); }
            update(now) {
                if (now - this.lastSpawn > 20000) {
                    roaches.push(new Roach(this.x, this.y));
                    this.lastSpawn = now;
                }
            }
            draw() {
                // 巢穴主體改為紅色，與蟻巢區別
                ctx.fillStyle = '#aa2222';
                ctx.beginPath(); ctx.arc(this.x, this.y, 15, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#5a3a1a';
                ctx.beginPath(); ctx.arc(this.x-4, this.y-4, 3, 0, 2*Math.PI); ctx.fill();
            }
        }

        // --- 輔助函式 (保持不變) ---
        function findNearestActiveTreat(obj) {
            let best = null, minD = Infinity;
            treats.forEach(t => {
                if (t.amount > 0) {
                    let d = Math.hypot(t.x - obj.x, t.y - obj.y);
                    if (d < minD) { minD = d; best = t; }
                }
            });
            return best;
        }

        function findNearest(obj, list) {
            let best = null, minD = Infinity;
            list.forEach(i => {
                let d = Math.hypot(i.x - obj.x, i.y - obj.y);
                if (d < minD) { minD = d; best = i; }
            });
            return best;
        }

        function triggerGameOver(msg) {
            if (gameOver) return;
            gameOver = true;
            alert(msg);
            location.reload();
        }

        // --- 遊戲邏輯與繪圖 (高頻點心生成) ---
        function update() {
            if (gameOver) return;
            const now = performance.now();

            // 過濾已耗盡點心
            treats = treats.filter(t => t.amount > 0);

            // 高頻率生成點心 (每250ms 2~4個，總數不超過40)
            if (now - lastTreatSpawnTime >= TREAT_SPAWN_INTERVAL) {
                const spawnCount = Math.floor(Math.random() * 3) + 2; // 2~4
                for (let i = 0; i < spawnCount; i++) {
                    if (treats.length < MAX_TREATS) {
                        treats.push({
                            x: Math.random() * W,
                            y: Math.random() * H,
                            amount: Math.floor(Math.random() * 4) + 2 // 2~5
                        });
                    } else break;
                }
                lastTreatSpawnTime = now;
            }

            // 消耗週期
            let timeRemaining = Math.max(0, CONSUME_CYCLE - (now - lastConsumeTime));
            let workers = ants.filter(a => a.type === 'worker');
            let soldiers = ants.filter(a => a.type === 'soldier');
            let expectedConsume = 2 + workers.length * 1 + soldiers.length * 1;

            if (now - lastConsumeTime >= CONSUME_CYCLE) {
                if (food >= expectedConsume) {
                    food -= expectedConsume;
                } else {
                    let shortage = expectedConsume - food;
                    food = 0;
                    for(let i=0; i<shortage; i++) {
                        let idx = ants.findIndex(a => a.type !== 'queen');
                        if (idx !== -1) ants.splice(idx, 1);
                        else triggerGameOver("蟻后餓死了...");
                    }
                }
                lastConsumeTime = now;
            }

            // 更新實體
            ants.forEach(a => a.update(now));
            roaches.forEach(r => r.update());
            roachNests.forEach(n => n.update(now));

            // 更新 UI
            document.getElementById('food-display').textContent = `${Math.floor(food)}/${maxFood}`;
            document.getElementById('timer-display').textContent = `00:${Math.ceil(timeRemaining/1000).toString().padStart(2, '0')}`;
            document.getElementById('consume-display').textContent = `-${expectedConsume}`;
            document.getElementById('pop-display').textContent = `${workers.length} / ${soldiers.length}`;
            document.getElementById('level-display').textContent = anthill.level;
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            // 蟻巢
            ctx.fillStyle = '#3d2b1f';
            ctx.beginPath(); ctx.arc(anthill.x, anthill.y, anthill.r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#6b4f35';
            ctx.beginPath(); ctx.arc(anthill.x-5, anthill.y-5, 6, 0, 2*Math.PI); ctx.fill();

            // 點心
            treats.forEach(t => {
                if (t.amount > 0) {
                    ctx.fillStyle = '#f9a8d4';
                    ctx.shadowColor = '#f472b6';
                    ctx.shadowBlur = 10;
                    ctx.beginPath(); ctx.arc(t.x, t.y, 5 + t.amount * 1.5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 4;
                    ctx.beginPath(); ctx.arc(t.x-2, t.y-2, 2, 0, 2*Math.PI); ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            roachNests.forEach(n => n.draw());
            roaches.forEach(r => r.draw());
            ants.forEach(a => a.draw());

            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // --- 初始化與事件 (響應式調整) ---
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            W = canvas.width = container.clientWidth;
            H = canvas.height = container.clientHeight;
            anthill.x = W / 2;
            anthill.y = H / 2;
        }

        window.onload = () => {
            resizeCanvas();
            
            ants.push(new Ant(anthill.x, anthill.y, 'queen'));

            // 初始多一點點心
            for (let i = 0; i < 15; i++) {
                treats.push({ x: Math.random()*W, y: Math.random()*H, amount: Math.floor(Math.random()*4)+2 });
            }

            loop();
        };

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        document.getElementById('btn-worker').onclick = () => {
            if (food >= WORKER_COST) { food -= WORKER_COST; ants.push(new Ant(anthill.x, anthill.y, 'worker')); }
        };

        document.getElementById('btn-soldier').onclick = () => {
            if (food >= SOLDIER_COST) { food -= SOLDIER_COST; ants.push(new Ant(anthill.x, anthill.y, 'soldier')); }
        };

        document.getElementById('btn-upgrade').onclick = () => {
            let cost = Math.floor(maxFood * 0.8);
            if (food >= cost) {
                food -= cost;
                anthill.level++;
                anthill.r += 10;
                maxFood += 20;

                // 生成新蟑螂巢穴在邊界旁 (避免直接生在蟻后附近)
                const margin = 30;
                const side = Math.floor(Math.random() * 4); // 0:上, 1:右, 2:下, 3:左
                let x, y;
                if (side === 0) { // 上邊
                    x = Math.random() * W;
                    y = margin;
                } else if (side === 1) { // 右邊
                    x = W - margin;
                    y = Math.random() * H;
                } else if (side === 2) { // 下邊
                    x = Math.random() * W;
                    y = H - margin;
                } else { // 左邊
                    x = margin;
                    y = Math.random() * H;
                }
                roachNests.push(new RoachNest(x, y));
            } else alert(`糧食不足，需要 ${cost} 🍯`);
        };
    </script>
</body>
</html>
